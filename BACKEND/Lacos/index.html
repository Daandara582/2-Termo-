<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Padaria do SENAI - Sistema Gráfico</title>
    <style>
        /* Um pouco de CSS para ficar bonito */
        body { font-family: sans-serif; display: flex; justify-content: center; background-color: #f4f4f4; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 300px; }
        h2 { color: #d32f2f; text-align: center; }
        input { width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #2e7d32; color: white; border: none; cursor: pointer; border-radius: 5px; }
        button:hover { background-color: #1b5e20; }
        #resultado { margin-top: 15px; font-weight: bold; color: #333; text-align: center; }
    </style>
</head>
<body>

<div class="card">
    <h2>🍞 Padaria SENAI</h2>
    
    <label>Preço do Pão (R$):</label>
    <input type="number" id="preco" placeholder="Ex: 0.50">

    <label>Quantidade:</label>
    <input type="number" id="quantidade" placeholder="Ex: 10">

    <button onclick="calcular()">CALCULAR TOTAL</button>

    <div id="resultado"></div>
</div>

<script>
    // A lógica JavaScript que você já conhece!
    function calcular() {
        // Pegando os valores das caixinhas (inputs)
        const preco = parseFloat(document.getElementById('preco').value);
        const qtd = parseInt(document.getElementById('quantidade').value);
        const divResultado = document.getElementById('resultado');

        // Validação simples (o nosso if/else!)
        if (isNaN(preco) || isNaN(qtd)) {
            divResultado.innerHTML = "❌ Por favor, preencha os campos!";
            divResultado.style.color = "red";
        } else {
            const total = preco * qtd;
            // Mostrando o resultado na tela
            divResultado.innerHTML = `Total da Venda: R$ ${total.toFixed(2)}`;
            divResultado.style.color = "green";
        }
    }
</script>

</body>
</html>
